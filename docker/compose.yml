services:
  quiz-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      # Mount host directory for database persistence
      - ../data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Set database path to the mounted volume
      - DB_PATH=/app/data/quiz_database.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

